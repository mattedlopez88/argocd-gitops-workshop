apiVersion: apps/v1
kind: Deployment
metadata:
  name: whack-a-mole
  namespace: default
  labels:
    app: whack-a-mole
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whack-a-mole
  template:
    metadata:
      labels:
        app: whack-a-mole
    spec:
      containers:
        - name: whack-a-mole
          image: ghcr.io/mattedlopez88/argocd-gitops-workshop:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
