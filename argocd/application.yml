apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whack-a-mole
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattedlopez88/argocd-gitops-workshop.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  # El HPA ajusta spec.replicas; sin esto, selfHeal lo devolvería a 2.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
